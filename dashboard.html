<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>D2Cabs Dashboard</title>
<style>
/* D2Cabs — Customer Dashboard
   Uses the same brand tokens as the rest of the site (see public/css/index.css)
   so it looks like part of D2Cabs, not a bolted-on admin panel. Built
   responsive from the start: phone / tablet / laptop+ tiers, iOS safe-area,
   16px inputs (no auto-zoom), 44px touch targets. */

.d2dash {
  --brand: #123A5C;
  --brand-dark: #0B2A44;
  --field-bg: #F5F7FA;
  --field-border: #E4E9EF;
  --text: #123A5C;
  --muted: #5B7285;

  min-height: 100vh;
  min-height: 100dvh;
  width: 100%;
  max-width: 100vw;
  overflow-x: hidden;
  background: var(--field-bg);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}

.d2dash * {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

.d2dash button,
.d2dash a,
.d2dash input {
  outline: none;
}

.d2dash button:focus,
.d2dash button:focus-visible,
.d2dash a:focus,
.d2dash a:focus-visible {
  outline: none;
  box-shadow: none;
}

/* ---------- Header ---------- */

.d2dash-header {
  background: #fff;
  border-bottom: 1px solid var(--field-border);
  padding: max(14px, env(safe-area-inset-top)) 16px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 20;
}

.d2dash-brand {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  text-decoration: none;
  color: var(--text);
}

.d2dash-brand span {
  font-weight: 900;
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.d2dash-brand small {
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--muted);
}

.d2dash-header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Just a circular avatar button — no name text, matches a normal website
   header (tap it to open the account menu). */
.d2dash-profile-icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: 0;
  padding: 0;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  cursor: pointer;
}

.d2dash-header-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--brand), var(--brand-dark));
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 0.9rem;
  flex-shrink: 0;
}

/* Account menu — a panel that slides in over half the screen, with the
   rest of the page dimmed behind it. Tapping an item then opens that
   section as its own full page. */
.d2dash-menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 49;
  background: rgba(11, 42, 68, 0.35);
}

.d2dash-fullmenu {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  width: 75%;
  background: #fff;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  box-shadow: -12px 0 32px rgba(11, 42, 68, 0.22);
}

.d2dash-fullmenu-top {
  padding: max(16px, env(safe-area-inset-top)) 14px 8px;
  flex-shrink: 0;
}

.d2dash-fullmenu-close {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--field-bg);
  border: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--text);
  cursor: pointer;
}

.d2dash-fullmenu-list {
  padding: 8px 14px 40px;
  display: grid;
}

.d2dash-fullmenu-list button {
  text-align: left;
  background: none;
  border: 0;
  border-top: 1px solid var(--field-border);
  padding: 17px 4px;
  font-size: 0.98rem;
  line-height: 1.25;
  font-weight: 800;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
}

.d2dash-fullmenu-list button:first-child {
  border-top: 0;
}

.d2dash-fullmenu-list button.active {
  color: var(--brand);
}

.d2dash-fullmenu-list button .d2dash-nav-icon {
  font-size: 1.35rem;
  flex-shrink: 0;
}

.d2dash-fullmenu-list .d2dash-row-danger {
  color: #C0392B;
}

/* ---------- Layout ---------- */

.d2dash-main {
  width: 100%;
  min-width: 0;
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px;
  display: grid;
  gap: 16px;
}

.d2dash-main > * {
  min-width: 0;
}

/* Single centered column — content width, navigated from the header
   (profile menu), not a fixed app-style bottom bar. */
.d2dash-single-col {
  max-width: 560px;
}

.d2dash-card {
  background: #fff;
  border-radius: 20px;
  border: 1px solid var(--field-border);
  box-shadow: 0 8px 24px rgba(11, 42, 68, 0.06);
  padding: 18px;
}

.d2dash-card h3 {
  margin: 0 0 4px;
  font-size: 1rem;
  font-weight: 900;
}

.d2dash-card .d2dash-sub {
  margin: 0 0 14px;
  font-size: 0.78rem;
  font-weight: 400;
  color: var(--muted);
}

/* Profile summary */

.d2dash-profile {
  display: flex;
  align-items: center;
  gap: 14px;
}

.d2dash-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--brand), var(--brand-dark));
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 1.2rem;
  flex-shrink: 0;
}

.d2dash-profile-info h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 900;
}

.d2dash-profile-info p {
  margin: 2px 0 0;
  font-size: 0.8rem;
  color: var(--muted);
}

/* Quick action */

.d2dash-book-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 48px;
  background: var(--brand);
  color: #fff;
  font-weight: 800;
  font-size: 0.88rem;
  border: 0;
  border-radius: 14px;
  text-decoration: none;
  margin-top: 14px;
  cursor: pointer;
}

.d2dash-book-btn:active {
  background: var(--brand-dark);
}

/* Empty states */

.d2dash-empty {
  text-align: center;
  padding: 22px 10px;
  color: var(--muted);
}

.d2dash-empty p {
  margin: 0 0 12px;
  font-size: 0.82rem;
  line-height: 1.5;
}

.d2dash-empty-icon {
  font-size: 1.6rem;
  margin-bottom: 6px;
  display: flex;
  justify-content: center;
  color: var(--muted);
}

.d2dash-link-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1px solid var(--brand);
  color: var(--brand);
  font-weight: 800;
  font-size: 0.8rem;
  text-decoration: none;
  background: #fff;
}

/* ---------- Bookings: tabs + trip cards ----------
   No outer bordered wrapper here (that caused the "box inside a box" look) —
   the section sits directly on the dashboard's grey background, and only
   the individual trip cards below get their own white card treatment. */

.d2dash-bookings-section {
  padding: 4px 2px 0;
  min-width: 0;
}

.d2dash-bookings-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
  padding: 0 2px;
}

.d2dash-bookings-head h3 {
  margin: 0 0 2px;
  font-size: 1rem;
  font-weight: 900;
  color: var(--text);
}

.d2dash-bookings-head p {
  margin: 0;
  font-size: 0.78rem;
  color: var(--muted);
}

.d2dash-bookings-head .d2dash-link-btn {
  flex-shrink: 0;
  padding: 0 14px;
  min-height: 38px;
  font-size: 0.74rem;
}

/* Pill tabs — same pattern as the FAQ page's category strip (.tabs/.tab) */
/* Equal-width grid — every tab (including the last one) is always fully
   visible, nothing gets clipped at the screen edge. */
.d2dash-tabs {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
  padding: 12px 2px;
}

.d2dash-tab {
  min-height: 40px;
  border: 1.5px solid var(--field-border);
  border-radius: 14px;
  background: #fff;
  color: var(--muted);
  font-weight: 800;
  font-size: 0.72rem;
  padding: 8px 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.d2dash-tab.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #fff;
}

.d2dash-tab:active {
  transform: scale(0.98);
}

.d2dash-booking-list {
  display: grid;
  gap: 14px;
}

.d2dash-booking-card {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(11, 42, 68, 0.08);
  padding: 16px;
}

.d2dash-bookings-section .d2dash-empty {
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(11, 42, 68, 0.06);
}

.d2dash-booking-tag {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  padding: 3px 9px;
  border-radius: 20px;
  margin-bottom: 10px;
}

.d2dash-booking-tag.cancelled {
  background: #FCEAEA;
  color: #C0392B;
}

.d2dash-booking-tag.completed {
  background: #E8F5EC;
  color: #1E8E3E;
}

.d2dash-booking-triptype {
  display: inline-block;
  font-size: 0.66rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  padding: 3px 9px;
  border-radius: 20px;
  margin-bottom: 10px;
  margin-right: 6px;
  background: #DCEEFB;
  color: var(--brand);
}

.d2dash-booking-top {
  display: flex;
  align-items: center;
  gap: 10px;
}

.d2dash-booking-top .d2dash-avatar {
  width: 46px;
  height: 46px;
  font-size: 1rem;
  box-shadow: 0 0 0 3px #fff, 0 0 0 4px var(--field-border);
}

.d2dash-booking-driver {
  flex: 1;
  min-width: 0;
}

.d2dash-booking-driver strong {
  font-size: 0.96rem;
  letter-spacing: -0.01em;
}

.d2dash-booking-driver strong {
  display: block;
  font-size: 0.88rem;
  font-weight: 800;
}

.d2dash-booking-driver span {
  font-size: 0.7rem;
  color: var(--muted);
}

.d2dash-booking-rating {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.78rem;
  font-weight: 800;
  color: var(--text);
  flex-shrink: 0;
  background: #FFF6E5;
  padding: 5px 10px;
  border-radius: 999px;
}

.d2dash-booking-rating svg {
  color: #F5A623;
}

.d2dash-booking-meta {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  font-size: 0.74rem;
  color: var(--muted);
  font-weight: 700;
}

.d2dash-booking-meta span {
  display: flex;
  align-items: center;
  gap: 5px;
}

.d2dash-booking-date {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--field-bg);
  font-size: 0.74rem;
  color: var(--muted);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}

.d2dash-booking-date span:last-child {
  color: var(--text);
  font-weight: 800;
}

.d2dash-booking-route {
  margin-top: 12px;
  padding-left: 4px;
  border-left: 2px dotted var(--field-border);
  display: grid;
  gap: 10px;
}

.d2dash-booking-route div {
  position: relative;
  padding-left: 14px;
  font-size: 0.84rem;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.d2dash-booking-route div::before {
  content: '';
  position: absolute;
  left: -5px;
  top: 4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brand);
}

.d2dash-booking-vehicle {
  margin-top: 10px;
  padding: 10px 12px;
  border-top: 1px solid var(--field-border);
  border-bottom: 1px solid var(--field-border);
  font-size: 0.76rem;
  color: var(--muted);
  font-weight: 700;
  display: grid;
  gap: 6px;
}

.d2dash-booking-vehicle-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.d2dash-booking-vehicle-row b {
  color: var(--text);
}

/* Date / Time / Car Type / Trip Type / Vehicle / Number Plate list */
.d2dash-booking-info {
  margin-top: 12px;
  padding: 10px 12px;
  border-top: 1px solid var(--field-border);
  border-bottom: 1px solid var(--field-border);
  display: grid;
  gap: 8px;
}

.d2dash-booking-info-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 700;
}

.d2dash-booking-info-row b {
  color: var(--text);
  font-weight: 800;
}

.d2dash-booking-payment {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--field-bg);
  border: 0;
  border-radius: 12px;
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--muted);
  font-family: inherit;
  cursor: pointer;
}

.d2dash-fare-caret {
  font-size: 0.6rem;
  color: var(--muted);
  margin-left: 4px;
}

/* Tap-to-expand fare breakdown — base fare, taxes, payment method */
.d2dash-fare-detail {
  margin-top: 8px;
  padding: 10px 12px;
  border: 1px dashed var(--field-border);
  border-radius: 12px;
  display: grid;
  gap: 6px;
}

.d2dash-fare-detail-row {
  display: flex;
  justify-content: space-between;
  font-size: 0.74rem;
  font-weight: 700;
  color: var(--muted);
}

.d2dash-fare-detail-row b {
  color: var(--text);
}

.d2dash-fare-total {
  padding-top: 6px;
  border-top: 1px solid var(--field-border);
  color: var(--text);
  font-weight: 800;
}

.d2dash-fare-total b {
  font-size: 0.86rem;
}

.d2dash-booking-payment b {
  color: var(--text);
  font-size: 0.9rem;
}

.d2dash-booking-payment .paid {
  color: #1E8E3E;
  font-weight: 800;
}

.d2dash-booking-payment .pending {
  color: #C0392B;
  font-weight: 800;
}

.d2dash-booking-actions {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.d2dash-booking-actions button {
  flex: 1;
  min-height: 44px;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.8rem;
  cursor: pointer;
}

.d2dash-booking-actions .cancel-btn {
  background: #fff;
  border: 1px solid var(--field-border);
  color: var(--muted);
}

.d2dash-booking-actions .track-btn {
  background: var(--brand);
  border: 0;
  color: #fff;
}

.d2dash-booking-actions .download-btn {
  background: #fff;
  border: 1px solid var(--brand);
  color: var(--brand);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

/* Active-ride row: Call / Message / Cancel Ride — all three equal width */
.d2dash-actions-3 {
  align-items: stretch;
}

.d2dash-actions-3 .icon-btn,
.d2dash-actions-3 .cancel-btn {
  flex: 1;
  min-width: 0;
  padding: 0 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  text-decoration: none;
  border-radius: 12px;
  font-weight: 800;
  font-size: 0.76rem;
  cursor: pointer;
}

.d2dash-actions-3 .call-btn {
  background: #E8F5EC;
  border: 1px solid #E8F5EC;
  color: #1E8E3E;
}

.d2dash-actions-3 .message-btn {
  background: var(--field-bg);
  border: 1px solid var(--field-border);
  color: var(--text);
}

.d2dash-actions-3 .cancel-btn {
  background: #FCEAEA;
  border: 1px solid #FCEAEA;
  color: #C0392B;
}

/* Grid of secondary cards (addresses / payments / support) */

.d2dash-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}

.d2dash-row-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  padding: 0 4px;
  background: none;
  border: 0;
  border-top: 1px solid var(--field-border);
  color: var(--text);
  font-weight: 700;
  font-size: 0.84rem;
  cursor: pointer;
  text-decoration: none;
}

.d2dash-row-btn:first-of-type {
  border-top: 0;
}

.d2dash-row-btn .arrow {
  color: var(--muted);
}

/* ---------- Tablet (600 - 1023px) ---------- */

@media (min-width: 600px) and (max-width: 1023px) {
  .d2dash-main {
    padding: 24px;
  }

  .d2dash-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .d2dash-grid > .d2dash-card.d2dash-span-2 {
    grid-column: span 2;
  }
}

/* ---------- Laptop / Desktop (>=1024px) ---------- */

@media (min-width: 1024px) {
  .d2dash-header {
    padding-left: clamp(24px, 4vw, 56px);
    padding-right: clamp(24px, 4vw, 56px);
  }

  .d2dash-main {
    padding: 32px clamp(24px, 4vw, 56px);
  }

  .d2dash-col-main {
    display: grid;
    gap: 16px;
  }

  .d2dash-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  /* On a wide screen the phone-width column stays centered rather than
     stretching edge to edge — still one column, just like the app. */
  .d2dash-single-col {
    margin: 0 auto;
  }
}

/* Touch targets on coarse-pointer devices */
@media (pointer: coarse) {
  .d2dash button,
  .d2dash a.d2dash-link-btn,
  .d2dash a.d2dash-book-btn {
    min-height: 44px;
  }
}

/* Icon used inline inside the header profile dropdown's nav items */
.d2dash-nav-icon {
  font-size: 0.95rem;
  display: inline-flex;
  vertical-align: -2px;
  color: var(--muted);
}

.d2dash-fullmenu-list button.active .d2dash-nav-icon,
.d2dash-fullmenu-list button:hover .d2dash-nav-icon {
  color: currentColor;
}

/* ---------- Home tab: hero + service shortcuts ---------- */

.d2dash-hero-card {
  padding-bottom: 20px;
}

.d2dash-hero-greet {
  margin: 0 0 2px;
  font-size: 1.1rem;
  font-weight: 900;
}

.d2dash-hero-route {
  margin-top: 14px;
  display: grid;
  gap: 10px;
  position: relative;
}

/* Real, searchable pickup/drop fields — same look (pin icon + From/To
   label + input) and same Photon-backed search as the homepage's own
   booking form, so it reads as the same form. */
.d2dash-loc-field {
  position: relative;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
  border-radius: 16px;
  padding: 10px 14px;
}

.d2dash-loc-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.d2dash-loc-text {
  flex: 1;
  min-width: 0;
  display: grid;
}

.d2dash-loc-text label {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--brand);
}

.d2dash-loc-field input {
  width: 100%;
  border: 0;
  background: none;
  padding: 0;
  font-size: 0.86rem;
  font-weight: 700;
  color: var(--text);
  font-family: inherit;
}

.d2dash-loc-field input::placeholder {
  color: var(--muted);
  font-weight: 400;
}

.d2dash-loc-field input:focus {
  outline: none;
}

.d2dash-loc-suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 40;
  background: #fff;
  border: 1px solid var(--field-border);
  border-radius: 12px;
  box-shadow: 0 10px 24px rgba(11, 42, 68, 0.14);
  max-height: 220px;
  overflow-y: auto;
}

.d2dash-loc-suggestions div {
  padding: 10px 12px;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  border-top: 1px solid var(--field-border);
  cursor: pointer;
}

.d2dash-loc-suggestions div:first-child {
  border-top: 0;
}

.d2dash-loc-suggestions div:active {
  background: var(--field-bg);
}

.d2dash-service-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

// Same localStorage keys used by the login/signup flow in public/js/index.js —

function getSessionUser() {

/* ---------------- Real pickup/drop search — same Photon API + Indore
   bias the actual homepage booking form uses, so results match. ---------- */

const INDORE_LAT = 22.7196;
const INDORE_LON = 75.8577;

async function searchLocations(query) {
  const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&lat=${INDORE_LAT}&lon=${INDORE_LON}&limit=6&lang=en`;
  const res = await fetch(url, { method: 'GET', mode: 'cors', headers: { Accept: 'application/json' } });
  if (!res.ok) throw new Error('search failed: ' + res.status);
  const data = await res.json();
  const features = (data.features || []).filter((f) => {
    const p = f.properties || {};
    return !p.countrycode || p.countrycode === 'IN';
  });
  return features.map((f) => {
    const p = f.properties || {};
    const coords = (f.geometry && f.geometry.coordinates) || [];
    const primary = p.name || p.street || p.district || 'Unknown';
    const area = p.city || p.district || p.state || 'India';
    const label = primary.toLowerCase() === area.toLowerCase() ? primary : `${primary}, ${area}`;
    return { label, lat: coords[1], lon: coords[0] };
  });
}

function LocationField({ kind, place, onChange }) {
  const [query, setQuery] = useState(place.label || '');
  const [suggestions, setSuggestions] = useState([]);
  const [open, setOpen] = useState(false);
  const timerRef = useRef(null);

  function handleInput(val) {
    setQuery(val);
    onChange({ label: val, lat: null, lon: null });
    clearTimeout(timerRef.current);
    if (val.trim().length < 3) {
      setSuggestions([]);
      setOpen(false);
      return;
    }
    timerRef.current = setTimeout(async () => {
      try {
        const results = await searchLocations(val.trim());
        setSuggestions(results);
        setOpen(results.length > 0);
      } catch (err) {
        setSuggestions([]);
        setOpen(false);
      }
    }, 350);
  }

  function pick(r) {
    setQuery(r.label);
    onChange({ label: r.label, lat: r.lat, lon: r.lon });
    setSuggestions([]);
    setOpen(false);
  }

  return (
    <div className={`d2dash-loc-field ${kind}`}>
      <div className="d2dash-loc-row">
        <div className="d2dash-loc-text">
          <label>{kind === 'pickup' ? 'From' : 'To'}</label>
          <input
            type="text"
            value={query}
            placeholder={kind === 'pickup' ? 'Enter Pickup Location' : 'Enter Drop Location'}
            onChange={(e) => handleInput(e.target.value)}
            onFocus={() => suggestions.length && setOpen(true)}
            onBlur={() => setTimeout(() => setOpen(false), 150)}
          />
        </div>
      </div>
      {open && (
        <div className="d2dash-loc-suggestions">
          {suggestions.map((r, i) => (
            <div key={i} onMouseDown={() => pick(r)}>{r.label}</div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------- Bookings view ---------------- */

function BookingsView({ firstName }) {
  const [tab, setTab] = useState('active');
  const list = BOOKINGS[tab];
  const [pickup, setPickup] = useState({ label: '', lat: null, lon: null });
  const [drop, setDrop] = useState({ label: '', lat: null, lon: null });
  const navigate = useNavigate();

  const emptyText = {
    active: 'No active booking right now.',
    upcoming: 'No upcoming bookings.',
    completed: "You haven't completed a ride yet.",
    cancelled: 'No cancelled bookings.',
  }[tab];

  function handleBookRide() {
    // Hand the chosen pickup/drop off to the homepage booking form (same
    // keys public/js/index.js reads on load) so the customer continues
    // straight from where they left off instead of restarting the flow.
    localStorage.setItem(
      'd2cabsPendingLocations',
      JSON.stringify({
        fromLabel: pickup.label,
        fromLat: pickup.lat,
        fromLon: pickup.lon,
        toLabel: drop.label,
        toLat: drop.lat,
        toLon: drop.lon,
      })
    );
    navigate('/#homeScreen');
  }

  return (
    <section className="d2dash-bookings-section">
      <div className="d2dash-card d2dash-hero-card">
        <h2 className="d2dash-hero-greet">Hi, {firstName}</h2>
        <p className="d2dash-sub">Where are you going today?</p>
        <div className="d2dash-hero-route">
          <LocationField kind="pickup" place={pickup} onChange={setPickup} />
          <LocationField kind="drop" place={drop} onChange={setDrop} />
        </div>
        <button className="d2dash-book-btn" type="button" onClick={handleBookRide}>
          Book a Ride

      </div>

      <div className="d2dash-tabs d2dash-tabs-4">
        {BOOKING_TABS.map((t) => (
          <button
            key={t.key}
            type="button"
            className={`d2dash-tab${tab === t.key ? ' active' : ''}`}
            onClick={() => setTab(t.key)}
          >
            {t.label}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <div className="d2dash-empty">
          <div className="d2dash-empty-icon">{tab === 'cancelled' ? <BanIcon /> : <CarIcon />}</div>
          <p>{emptyText}</p>
          {(tab === 'active' || tab === 'upcoming') && (

          {list.map((b) => (
            <BookingCard key={b.id} booking={b} />
          ))}
        </div>
      )}
    </section>
  );
}

function AccountSettings({ user, onSave }) {
  const [name, setName] = useState(user.name || '');
  const [email, setEmail] = useState(user.email || '');
  const [phone, setPhone] = useState(user.phone || '');
  const [savedMsg, setSavedMsg] = useState('');

  function handleUpdate(e) {
    e.preventDefault();
    const users = getUsers();
    const idx = users.findIndex((u) => u.phone === user.phone);
    if (idx === -1) return;
    users[idx] = { ...users[idx], name, email, phone };
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
    // Phone doubles as the session key, so keep the session pointer in sync
    // if the user changed their number.
    localStorage.setItem(SESSION_KEY, phone);
    onSave(users[idx]);
    setSavedMsg('Saved!');
    setTimeout(() => setSavedMsg(''), 2000);
  }

  return (
    <section className="d2dash-card">
      <h3>Account Settings</h3>
      <p className="d2dash-sub">Personal Info</p>

      <form className="d2dash-settings-card" onSubmit={handleUpdate}>
        <label className="d2dash-field">
          <span>Name</span>
          <input type="text" value={name} onChange={(e) => setName(e.target.value)} required />
        </label>
        <label className="d2dash-field">
          <span>Email</span>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
        </label>
        <label className="d2dash-field">
          <span>Phone Number</span>
          <input type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} required />
        </label>
        <div className="d2dash-settings-footer">
          {savedMsg && <span className="d2dash-saved-msg">{savedMsg}</span>}
          <button className="d2dash-update-btn" type="submit">Update</button>
        </div>
      </form>
    </section>
  );
}

  const items = [
    { key: 'bookings', label: 'My Bookings', Icon: BookingsIcon },
    { key: 'offers', label: 'Offers', Icon: GiftIcon },
    { key: 'addresses', label: 'Saved Addresses', Icon: PinIcon },
    { key: 'payments', label: 'Payments', Icon: CardIcon },
    { key: 'reviews', label: 'Ratings & Reviews', Icon: StarIcon },
    { key: 'support', label: 'Help & Support', Icon: HelpIcon },
    { key: 'settings', label: 'Account Settings', Icon: SettingsIcon },
  ];

  return (
    <>
      <button
        className="d2dash-profile-icon-btn"
        type="button"
        onClick={() => setOpen(true)}
        aria-label="Account menu"
      >
        <span className="d2dash-header-avatar">{firstName.charAt(0).toUpperCase()}</span>
      </button>

      {open && (
        <>
        <div className="d2dash-menu-backdrop" onClick={() => setOpen(false)} />
        <div className="d2dash-fullmenu">
          <div className="d2dash-fullmenu-top">
            <button
              className="d2dash-fullmenu-close"
              type="button"
              onClick={() => setOpen(false)}
              aria-label="Close menu"
            >
              <CloseIcon />
            </button>
          </div>

          <div className="d2dash-fullmenu-list">
            {items.map((it) => (
              <button
                key={it.key}
                type="button"
                className={view === it.key ? 'active' : ''}
                onClick={() => {
                  setView(it.key);
                  setOpen(false);
                }}
              >
                <span className="d2dash-nav-icon"><it.Icon /></span> {it.label}
              </button>
            ))}
            <button
              type="button"
              className="d2dash-row-danger"
              onClick={() => {
                setOpen(false);
                onLogout();
              }}
            >
              <span className="d2dash-nav-icon"><LogoutIcon /></span> Log Out
            </button>
          </div>
        </div>
        </>
      )}
    </>
  );
}

/* ---------------- Root ---------------- */

function Dashboard() {
  const navigate = useNavigate();
  const [user, setUser] = useState(null);
  const [checked, setChecked] = useState(false);
  const [view, setView] = useState('bookings');

  useEffect(() => {
    setUser(getSessionUser());
    setChecked(true);
  }, []);

  function handleLogout() {
    localStorage.removeItem(SESSION_KEY);
    navigate('/');
  }

  if (checked && !user) {
    return (
      <div className="d2dash">
        <header className="d2dash-header">
          <Link className="d2dash-brand" to="/">
            <span>D2Cabs</span>
          </Link>
        </header>
        <main className="d2dash-main">
          <div className="d2dash-card d2dash-empty">
            <div className="d2dash-empty-icon"><LockIcon /></div>
            <p>You need to log in to see your dashboard.</p>
            <Link className="d2dash-link-btn" to="/">
              Go to login
            </Link>
          </div>
        </main>
      </div>
    );
  }

  if (!checked) return null;

  const firstName = user.name ? user.name.split(' ')[0] : 'there';

  return (
    <div className="d2dash">
      <header className="d2dash-header">
        <Link className="d2dash-brand" to="/">
          <span>D2Cabs</span>
        </Link>
        <HeaderProfileMenu view={view} setView={setView} firstName={firstName} onLogout={handleLogout} />
      </header>

      <main className="d2dash-main d2dash-single-col">
        <div className="d2dash-col-main">
          {view === 'bookings' && <BookingsView firstName={firstName} />}
          {view === 'offers' && <OffersView />}
          {view === 'settings' && <AccountSettings user={user} onSave={setUser} />}
          {view === 'addresses' && (
            <SimplePage title="Saved Addresses">
              <div className="d2dash-empty"><p>No saved addresses yet.</p></div>
            </SimplePage>
          )}
          {view === 'payments' && (
            <SimplePage title="Payment Methods">
              <div className="d2dash-empty"><p>No payment method saved yet.</p></div>
            </SimplePage>
          )}
          {view === 'reviews' && (
            <SimplePage title="Ratings & Reviews">
              <div className="d2dash-empty"><p>You haven't rated a ride yet.</p></div>
            </SimplePage>
          )}
          {view === 'support' && (
            <SimplePage title="Help & Support">
              <a className="d2dash-row-btn" href="https://wa.me/918889633535" target="_blank" rel="noreferrer">
                Chat on WhatsApp <span className="arrow">›</span>
              </a>
              <Link className="d2dash-row-btn" to="/faq.html">
                FAQs <span className="arrow">›</span>
              </Link>
              <Link className="d2dash-row-btn" to="/contact.html">
                Contact Us <span className="arrow">›</span>
              </Link>
            </SimplePage>
          )}
        </div>
      </main>
    </div>
  );
}

if (typeof Dashboard !== 'undefined') {
  ReactDOM.createRoot(document.getElementById('dashboard-root')).render(React.createElement(Dashboard));
}

</script>
</body>
</html>
